name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout | Repository
        uses: actions/checkout@v7

      - name: Validate | Tag matches VERSION
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          expected="v${version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected}" ]]; then
            echo "error: tag ${GITHUB_REF_NAME} does not match VERSION ${expected}" >&2
            exit 1
          fi

  build:
    name: Build | ${{ matrix.platform }} | ${{ matrix.arch }}
    needs: validate-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: macOS
            arch: x86_64
            artifact: DshDesktop-macos-x86_64
            path: dist/macos/DshDesktop-macos-x86_64.7z
          - os: macos-latest
            platform: macOS
            arch: arm64
            artifact: DshDesktop-macos-arm64
            path: dist/macos/DshDesktop-macos-arm64.7z
          - os: ubuntu-latest
            platform: Linux
            arch: x86_64
            artifact: DshDesktop-linux-x86_64
            path: dist/linux/DshDesktop-linux-x86_64.7z
          - os: windows-latest
            platform: Windows
            arch: x86_64
            artifact: DshDesktop-windows-x86_64
            path: dist/windows/DshDesktop-windows-x86_64.7z

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout | Repository
        uses: actions/checkout@v7

      - name: Toolchain | Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Toolchain | Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Dependencies | macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew list sevenzip >/dev/null 2>&1 || brew install sevenzip
          command -v go
          command -v bun
          command -v bunx
          command -v codesign
          command -v 7z || command -v 7zz

      - name: Dependencies | Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            curl \
            file \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            p7zip-full \
            pkg-config
          curl --fail --location \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            --output "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
          command -v go
          command -v bun
          command -v bunx
          command -v pkg-config
          command -v 7z
          test -x "$RUNNER_TEMP/appimagetool"

      - name: Dependencies | Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Command go | Out-Null
          Get-Command bun | Out-Null
          Get-Command bunx | Out-Null
          $sevenZipDirectory = Join-Path $env:ProgramFiles '7-Zip'
          $sevenZip = Join-Path $sevenZipDirectory '7z.exe'
          if (-not (Test-Path -PathType Leaf $sevenZip)) {
            throw "7-Zip was not found at $sevenZip"
          }
          $sevenZipDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build application
        run: bun run build.ts

      - name: Upload application
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download | Applications
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate | SHA-256 checksums
        shell: bash
        run: |
          cd dist
          find . -maxdepth 1 -type f -name 'DshDesktop-*.7z' -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
          test -s SHA256SUMS.txt

      - name: Publish | GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi
