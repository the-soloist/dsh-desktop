name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout | Repository
        uses: actions/checkout@v7

      - name: Validate | Tag matches VERSION
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          expected="v${version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected}" ]]; then
            echo "error: tag ${GITHUB_REF_NAME} does not match VERSION ${expected}" >&2
            exit 1
          fi

  build:
    needs: validate-tag
    uses: ./.github/workflows/native-build.yml

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download | Applications
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate | SHA-256 checksums
        shell: bash
        run: |
          cd dist
          find . -maxdepth 1 -type f -name 'DSH-Desktop-*.7z' -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
          test -s SHA256SUMS.txt

      - name: Publish | GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi
