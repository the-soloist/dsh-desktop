name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout | Repository
        uses: actions/checkout@v7

      - name: Toolchain | Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Toolchain | Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Quality | Go format
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "Files need gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Quality | Go vet
        run: go vet -tags server ./...
        env:
          CGO_ENABLED: 0

      - name: Quality | Go tests
        run: go test -tags server ./...
        env:
          CGO_ENABLED: 0

      - name: Quality | Build script
        run: |
          mkdir -p dist/intermediate
          bun build build.ts --target=bun --outfile=dist/intermediate/build-validation.js

  build:
    name: Build | ${{ matrix.platform }} | ${{ matrix.arch }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: macOS
            arch: x86_64
            artifact: DshDesktop-macos-x86_64
            path: dist/macos/DshDesktop-macos-x86_64.7z
          - os: macos-latest
            platform: macOS
            arch: arm64
            artifact: DshDesktop-macos-arm64
            path: dist/macos/DshDesktop-macos-arm64.7z
          - os: ubuntu-latest
            platform: Linux
            arch: x86_64
            artifact: DshDesktop-linux-x86_64
            path: dist/linux/DshDesktop-linux-x86_64.7z
          - os: windows-latest
            platform: Windows
            arch: x86_64
            artifact: DshDesktop-windows-x86_64
            path: dist/windows/DshDesktop-windows-x86_64.7z

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout | Repository
        uses: actions/checkout@v7

      - name: Toolchain | Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Toolchain | Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Dependencies | macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew list sevenzip >/dev/null 2>&1 || brew install sevenzip
          command -v go
          command -v bun
          command -v bunx
          command -v codesign
          command -v 7z || command -v 7zz

      - name: Dependencies | Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            curl \
            file \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            p7zip-full \
            pkg-config
          curl --fail --location \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            --output "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
          command -v go
          command -v bun
          command -v bunx
          command -v pkg-config
          command -v 7z
          test -x "$RUNNER_TEMP/appimagetool"

      - name: Dependencies | Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Command go | Out-Null
          Get-Command bun | Out-Null
          Get-Command bunx | Out-Null
          $sevenZipDirectory = Join-Path $env:ProgramFiles '7-Zip'
          $sevenZip = Join-Path $sevenZipDirectory '7z.exe'
          if (-not (Test-Path -PathType Leaf $sevenZip)) {
            throw "7-Zip was not found at $sevenZip"
          }
          $sevenZipDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build application
        run: bun run build.ts

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          compression-level: 0
