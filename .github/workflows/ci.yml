name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout | Repository
        uses: actions/checkout@v7

      - name: Toolchain | Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Toolchain | Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Quality | Go format
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "Files need gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Quality | Go vet
        run: go vet -tags server ./...
        env:
          CGO_ENABLED: 0

      - name: Quality | Build script
        run: |
          mkdir -p dist/intermediate
          bun build build.ts --target=bun --outfile=dist/intermediate/build-validation.js

  build:
    needs: quality
    uses: ./.github/workflows/native-build.yml
    with:
      smoke-test: true
