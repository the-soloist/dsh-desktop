<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{APPLICATION_NAME}}</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="startup">
    <header>
      <img class="logo" src="/logo.png" alt="">
      <h1>{{APPLICATION_NAME}}</h1>
    </header>

    <section class="status" aria-label="启动状态" aria-busy="true">
      <div class="status-heading">
        <span class="indicator" aria-hidden="true"></span>
        <h2 id="status-title" role="status" aria-live="polite">正在准备运行环境…</h2>
      </div>
      <p id="status-message" hidden></p>
    </section>
    <div class="actions" hidden>
      <button id="retry" type="button" hidden>重试</button>
    </div>
    <section class="logs" aria-labelledby="log-title">
      <div class="log-toolbar">
        <h2 id="log-title">启动记录</h2>
        <button id="copy" type="button">复制日志</button>
      </div>
      <div class="log-frame">
        <div class="log" tabindex="0" role="region" aria-label="启动日志"></div>
        <button id="new-logs" type="button" hidden>新日志 ↓</button>
      </div>
      <p id="feedback" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
